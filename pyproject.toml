[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcmagicc-repro"
version = "1.0.1"
description = "Standalone reproducibility companion for the GCMagicc v1.0.1 manuscript"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Nicolai Meinshausen"},
  {name = "Malte Meinshausen"},
]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2,<3",
  "xarray>=2024.1",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "h5netcdf>=1.3",
  "netCDF4>=1.6",
  "regionmask>=0.13",
  "torch>=2.2",
]
test = ["pytest>=8,<9"]

[project.scripts]
gcmagicc-repro = "gcmagicc_repro.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
